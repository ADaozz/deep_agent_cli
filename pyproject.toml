[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deep-agent-cli"
version = "0.1.3"
description = "A sandboxed coding agent CLI for Linux and WSL2"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "deepagents>=0.7.17,<0.8.0",
  "langchain>=1.0,<2.0",
  "langchain-core>=1.0,<2.0",
  "langchain-openai>=1.6.2,<1.7.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=3.1.1,<4",
  "httpx>=0.27,<1",
  "pyyaml>=6.0,<7.0",
  "prompt-toolkit>=3.0.48,<4.0",
  "rich>=13.9,<15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "build>=1.2,<2", "twine>=6,<7"]

[project.scripts]
deep-agent = "agent.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
include = ["/agent", "/README.md", "/LICENSE", "/pyproject.toml"]
core-metadata-version = "2.4"
