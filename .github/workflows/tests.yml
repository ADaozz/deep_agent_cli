name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      # No bubblewrap install and no REQUIRE_BWRAP_TEST: sandbox-dependent
      # tests skip themselves so a bare runner stays green without blocking.
      - name: Run tests
        run: python -m pytest -q
