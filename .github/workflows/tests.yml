name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test tools
        run: python -m pip install -e ".[dev]"
      # No bubblewrap install and no REQUIRE_BWRAP_TEST: sandbox-dependent
      # tests skip themselves so a bare runner stays green without blocking.
      - name: Run tests
        run: python -m pytest -q --tb=short -o faulthandler_timeout=30
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/deep-agent-wheel-test
          /tmp/deep-agent-wheel-test/bin/pip install dist/*.whl
          /tmp/deep-agent-wheel-test/bin/deep-agent --help
          mkdir -p /tmp/deep-agent-wheel-home /tmp/deep-agent-wheel-work
          cd /tmp/deep-agent-wheel-work
          HOME=/tmp/deep-agent-wheel-home /tmp/deep-agent-wheel-test/bin/deep-agent
          test -s /tmp/deep-agent-wheel-home/.deep-agent/config.yaml
          test -d /tmp/deep-agent-wheel-home/.deep-agent/skills
