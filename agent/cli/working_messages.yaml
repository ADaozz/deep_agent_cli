# 运行时可编辑副本：~/.deep-agent/working_messages.yaml（或 paths.config_dir 下）。
# 修改后重启 CLI 生效；首次启动复制此文件，不覆盖已有副本。
# 默认每两条笑话穿插一条宝具台词；所有条目都会参与轮播。
# jokes 可直接追加字符串，也可使用包含 text、speaker 的对象。
# 任一列表可设为 []；两个列表均为空时关闭文案，只显示状态。
# 原有冷笑话直接用中文创作；新增摘录由用户提供，来源名称保存在注释中。
# 宝具台词为日文原句的中文译文，非官方字幕；仅显示台词，不显示从者名。
# 核对链接保存在条目中；已有配置里的 fgo.speaker 不影响显示。
interval_seconds: 8
jokes:
- 代码说它没问题，问题说它也是这么想的。
- 今天的重构很成功：昨天的缺陷换了个目录。
- 缓存失效了，但我对缓存的怀疑一直有效。
- 人工智能写代码只用了十秒，我解释代码用了十杯咖啡。
- 测试全绿了，产品经理又加了一种颜色。
- 这个函数没有副作用，只有后遗症。
- 我给缺陷加了日志，它开始写自传。
- 递归终于结束了，因为我的耐心先返回了。
- 需求说自己很简单，顺手带来了三个微服务。
- 代码已经解耦，现在谁也不认识谁了。
- 类型检查通过了，人生的类型还没推断出来。
- 部署像抽卡：保底是回滚。
- 程序员的浪漫：我愿意为你保留一个永不超时的连接。
- 我把问题拆成了小问题，现在有一百个小问题。
- 昨天还能运行，说明昨天是个很好的测试环境。
- 日志说一切正常，看来日志也学会了报喜不报忧。
- 我的代码很有弹性：每改一处，就弹出一个新问题。
- 写注释的时候我懂了，读注释的时候我又不懂了。
- 程序员不怕失眠，怕的是睡醒以后忘了怎么复现。
- 我和服务器都需要休息，它重启了，我还没。
- 命名很难，所以这个变量暂时叫最终版本二。
- 今天没有新增功能，只新增了对自己的认识。
- 需求终于冻结了，只有截止日期还在融化。
- 这个补丁修复了问题，也为下个补丁提供了工作。
- 文档说只需三步，第二步是解决所有环境问题。
- 我给代码加了锁，现在连我自己也进不去了。
- 多线程提高了效率：几个错误可以同时出现。
- 这不是死循环，是程序舍不得下班。
- 数据库终于连上了，我的人际关系还在重试。
- 接口很稳定，稳定地返回同一个错误。
- 这段代码很简洁，解释它需要开三个会议。
- 程序员的健身计划：每天举起沉重的技术债。
- 我以为我在追踪缺陷，其实缺陷在带我参观项目。
- 代码审查通过了，咖啡审查还需要再来一杯。
- 我删除了无用代码，顺便发现它其实有用。
- 这个项目没有单点故障，每个点都能故障。
- 测试覆盖率提高了，我被问题覆盖的面积也提高了。
- 程序员许愿：愿所有空值都提前告诉我它是空的。
- 升级依赖只用了五分钟，降级研究了一下午。
- 我把配置集中管理了，现在只需猜一个文件。
- 部署成功的秘诀：先确认回滚按钮还在。
- 代码风格统一了，错误也整齐了许多。
- 问题在本地无法复现，它可能不喜欢我的工位。
- 自动化节省了时间，我把省下的时间用来修自动化。
- 我给函数起了个好名字，然后花一天让它名副其实。
- 一行代码解决问题的代价，是下一行开始研究人生。
- 服务器说请求太多，我说需求也是。
- 我的提交记录是一部悬疑小说，结局叫终于修好了。
# Linux / Unix（来源名称由用户提供）
# Unix & Linux Stack Exchange
- Unix 是用户友好的，只不过它比较挑用户。
# Funny Geek One-Liners
- Linux 是免费的，前提是你的时间不值钱。
# Unix & Linux Stack Exchange
- Unix 不阻止你干蠢事，因为那样也会妨碍你干聪明事。
- 我把灵魂挂载到了 /dev/null。
# Reddit
- Linux 用户的病情已经到了 Terminal（终末期）。
# Git / 编程（来源名称由用户提供）
# Reddit
- 我有个编程笑话，可惜它只在我的电脑上好笑。
- 我本来想 push 一个笑话，但担心产生 conflict。
- 我讲的笑话全被 Stack Overflow 标记成了重复问题。
# CMU School of Computer Science
- 任何足够高级的 Bug，都与 Feature 无法区分。
- Knuth：这段代码我已经证明是正确的，但还没运行过。
# AI / Coding Agent（来源名称由用户提供：Reddit）
- 以前写代码两小时，调试两小时；现在 AI 写代码五分钟，调试七小时。
- Vibe Coding 出了 Bug？没关系，可以 Vibe Debugging。
- AI 的商业模式：答案免费，正确答案另收费。
- AI 最奇怪的地方，是你一批评它，它就开始承认自己根本没犯过的错误。
- 我们发明 AI 是为了取代程序员，最后又雇了程序员来照顾 AI。
- Vibe Coding 的终极职业发展方向是成为 Vibe Coding 清理专家。
