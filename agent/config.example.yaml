# DeepAgent 示例配置。
# 首次启动命令行时，将此模板复制到 ~/.deep-agent/config.yaml 后退出。
#
# 通过 DEEP_AGENT_CONFIG=/path/outside/workspace/config.yaml 指定配置文件路径。

agent:
  # 长期用户指令，追加在内置身份说明之后。
  # instructions: |
  #   优先使用中文回答。
  instructions: null

tools:
  # 启动时从模型请求中隐藏的工具名。这里隐藏上下文压缩工具；/compact 仍可使用。
  hidden:
    - compact_conversation

ui:
  # 每次回答结束后显示时间所使用的 IANA 时区。
  timezone: Asia/Shanghai
  # 思考内容折叠时保留的逻辑行数，必须为正整数。
  thinking_tail_lines: 5
  # 命令输出及通用工具输出折叠时保留的逻辑行数。
  execute_tail_lines: 4
  tool_tail_lines: 8
  expanded_tool_lines: 40
  # 简略列表显示的条目数，按条目计数，不按屏幕换行计数。
  explore_preview_items: 5
  explore_failure_items: 3
  create_preview_items: 5
  # 文件预览行数；编辑预览至少为 2 行，才能同时显示新增和删除内容。
  edit_preview_changed_lines: 8
  write_preview_lines: 6
  # 工具执行失败时的摘要行数。
  failure_preview_lines: 4
  command_failure_tail_lines: 6
  # 编辑器和菜单的最大行数；实际高度可能因终端尺寸而缩小。
  editor_max_lines: 10
  completion_menu_lines: 8

llm:
  default: token-plan/qwen3.8-flash
  models:
    token-plan:
      base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api_key: ${TOKEN_PLAN_API_KEY}
      api: chat_completions
      # 额外重试次数；0 表示禁用，可在模型项中覆盖。
      max_retries: 5
      reasoning_efforts: [none, low, medium, xhigh]
      models:
        qwen3.8-flash:
          input: [text, image]
          context_window: 1m
    # --- 阿里云百炼：官方端点 ---
    # 设置 ALIYUN_API_KEY 环境变量，取消下列注释即可添加百炼来源。
    # 北京公共域名仍可使用，也可替换为官方业务空间专属域名。
    # https://help.aliyun.com/zh/model-studio/qwen-api-via-openai-responses
    # bailian:
    #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   api_key: ${ALIYUN_API_KEY}
    #   api: responses
    #   models:
    #     qwen3.5-plus:
    #       input: [text, image]
    #       context_window: 1m
    #     qwen3.8-flash:
    #       input: [text, image]
    #       context_window: 1m
    #       reasoning_efforts: [none, low, medium, xhigh]
    #     qwen3-vl-flash:
    #       api: chat_completions
    #       input: [text, image]
    #       context_window: 262144
    #
    # --- DeepSeek 官方：Chat Completions API ---
    # https://api-docs.deepseek.com/zh-cn/api/create-chat-completion/
    # deepseek:
    #   api_key: ${DEEPSEEK_API_KEY}
    #   base_url: https://api.deepseek.com/v1
    #   api: chat_completions
    #   reasoning_efforts: [none, low, high, max]
    #   models:
    #     deepseek-flash: {}
    #
    # --- 智谱官方：Chat Completions API ---
    # https://docs.bigmodel.cn/cn/guide/models/text/glm-5.3
    # zhipu:
    #   api_key: ${ZHIPU_API_KEY}
    #   base_url: https://open.bigmodel.cn/api/paas/v4
    #   api: chat_completions
    #   reasoning_efforts: [low, high, max]
    #   models:
    #     glm-5.3: {}
    #
    # 推理强度取决于模型、协议和端点，请按服务商文档维护列表。
    # 模型级省略的字段继承来源配置；声明列表时整表替换；null 或 [] 清除继承的列表。
    # default 仅为命令行选项，不要写入 reasoning_efforts。
    # Responses 使用 reasoning.effort 参数；Chat Completions 使用 reasoning_effort 参数。


web_search:
  # 可选配置。TAVILY_API_KEY 环境变量优先于此值；两者均未设置时隐藏 web_search 工具。
  # 也可以在私有配置 ~/.deep-agent/config.yaml 中直接填写密钥。
  tavily_api_key: null

sandbox:
  # 本段是最小基线，只覆盖常见本机布局。请按实际部署以及需要保护的目录调整挂载、PATH 和环境变量。
  # 可选挂载在源路径不存在时跳过，不表示对应工具已经可用。
  # 宿主机项目目录。沙箱内的路径和当前目录都使用它的真实绝对路径；“.” 表示启动终端界面时的当前目录。
  workspace: .
  bwrap_path: bwrap
  # restricted：工作区、skills 和声明的挂载可写，系统目录只读。
  # full-access：当前文件系统可写，仅保护 Agent 安装文件和配置目录。未设置时为 restricted。
  mode: restricted
  # 默认不限制执行时间；设置正数可限制每条命令的执行秒数。
  timeout_seconds: null
  max_output_bytes: 100000
  # 明确允许传递给 Agent 命令的宿主机环境变量名称。
  # 有头浏览器复用宿主 X11 显示；宿主未设置 DISPLAY 时不传入。
  env_allowlist:
    - DISPLAY
  # 注入沙箱的固定环境变量。PATH 可自定义工具目录，请保留系统目录；/run/deep-agent 会自动置于最前。
  # NVM 的所有已安装版本挂载在 /opt/node 下；请自行将选定版本的 bin 目录加入 PATH，
  # 例如 /opt/node/<实际版本>/bin。PATH 不会展开通配符，也不会自动选择 Node 版本。
  # 使用系统 Node.js 时，已有的 /usr/bin 等系统路径即可；非标准安装位置请调整 source 和 PATH。
  # playwright-cli open 使用 /opt/google/chrome/chrome。不要在沙箱中执行
  # `npx playwright install chrome` 安装 Chrome，该命令需要 sudo apt-get。
  # 安装与命令行工具匹配的 Chromium：先在宿主机执行 `playwright-cli install-browser chromium`，再执行
  # `playwright-cli open --browser=chromium`。浏览器路径由 PLAYWRIGHT_BROWSERS_PATH 指定。
  env_set:
    PATH: /opt/cargo/bin:/usr/local/bin:/usr/bin:/bin
    RUSTUP_HOME: /opt/rustup
    PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
  # source 是宿主路径，支持 ~；destination 是沙箱内的绝对路径，不支持 ~。
  # extra_read_only_mounts 允许读取；extra_read_write_mounts 允许读取和写入。
  # optional: true 表示源目录不存在时跳过，不会寻找替代路径，也不保证工具可用。
  # 可按需求扩大或缩小挂载范围；若只需要一个 Node 版本，可将 source 缩小到该版本目录，
  # 并同步调整 PATH。挂载控制文件系统可见范围；ask / allow 仍独立决定工具调用是否需审批。
  # 挂载整个宿主目录会暴露其中的敏感文件；readonly 只能禁止写入，不能阻止读取。
  # 首次启动生成此配置；更新模板不会覆盖已有的 ~/.deep-agent/config.yaml，请自行调整。
  extra_read_only_mounts:
    - source: ~/.nvm/versions/node
      destination: /opt/node
      optional: true
    # Cargo 可执行文件与 Rustup 工具链分别挂载；自定义安装位置请同时调整 source 和环境变量。
    - source: ~/.cargo
      destination: /opt/cargo
      optional: true
    - source: ~/.rustup
      destination: /opt/rustup
      optional: true
    # Chrome 程序目录只读；浏览器缓存另行读写挂载。其他安装位置请修改 source / destination。
    - source: /opt/google
      destination: /opt/google
      optional: true
    # 常见 Linux / WSL2 环境的 X11 Socket 目录；文件 Socket 支持 network=false。
    # WSLg 若使用其他位置，可将 source 改为 /mnt/wslg/.X11-unix，保留同一个 destination。
    # 不要同时配置相同目标；无显示服务时跳过此挂载。
    - source: /tmp/.X11-unix
      destination: /tmp/.X11-unix
      optional: true
  # 可写的浏览器缓存；沙箱内的创建、修改和删除操作会同步到宿主机目录。
  # 若宿主使用 XDG_CACHE_HOME 或自定义 Playwright 缓存位置，请将 source 改为实际目录。
  extra_read_write_mounts:
    - source: ~/.cache/ms-playwright
      destination: /opt/ms-playwright
      optional: true

paths:
  # SQLite 会话数据库；null 表示使用 ~/.deep-agent/sessions/<workspace-hash>.sqlite3。
  state_path: null
  # 快捷键配置目录；null 表示使用 ~/.deep-agent。
  config_dir: null
