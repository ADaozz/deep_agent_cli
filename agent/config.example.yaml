# DeepAgent 示例配置。
# 首次启动命令行时，将此模板复制到 ~/.deep-agent/config.yaml 后退出。
#
# 通过 DEEP_AGENT_CONFIG=/path/outside/workspace/config.yaml 指定配置文件路径。

# 全局代理/CA 环境变量：模型 API、MCP HTTP/OAuth、Tavily、stdio MCP 和 execute。
# false（默认）：HTTP 客户端忽略代理/CA 环境变量，子进程也不传递这些变量。
# true：继承 HTTP_PROXY / HTTPS_PROXY / ALL_PROXY / NO_PROXY（含小写）和 CA 配置。
# 子进程额外支持 REQUESTS_CA_BUNDLE / CURL_CA_BUNDLE / NODE_EXTRA_CA_CERTS；
# NODE_USE_ENV_PROXY 未指定时自动设为 1，程序是否使用由其自身实现决定。
# 此项只写在主配置顶层，不写在 llm、sandbox 或 mcp.json 中。
# 修改后重启生效；不会开启 execute 的沙箱网络权限。
trust_env: false

agent:
  # 长期用户指令，追加在内置身份说明之后。
  # instructions: |
  #   优先使用中文回答。
  instructions: null

# 仅当问题可分解为多个独立、互不干扰的子问题时，主 Agent 才应派生 SubAgent。
subagents:
  enabled: true
  max_concurrent: 2
  # model 为 null：继承主 Agent 当前模型；否则必须是 llm.models 中的完整 ID。
  model: null
  # default（旧配置 null 等价）：使用子模型原生默认，不继承主 Agent 的强度。
  # 可显式填写目标模型支持的 low/high 等强度；暂不支持 auto。
  reasoning_effort: default
  # 只支持 allow；必须使用已经验证的 Bubblewrap 沙箱，无法使用时 task 明确失败。
  permission: allow

tools:
  # 启动时从模型请求中隐藏的工具名。这里隐藏上下文压缩工具；/compact 仍可使用。
  hidden:
    - compact_conversation

ui:
  # 每次回答结束后显示时间所使用的 IANA 时区。
  timezone: Asia/Shanghai
  # 内容折叠时保留的开头行数和末尾行数，均为正整数。
  # 命令、写入、差异和失败摘要使用 head_lines；思考和工具输出使用 tail_lines。
  head_lines: 4
  tail_lines: 4
  # 简略列表显示的条目数，按条目计数，不按屏幕换行计数。
  explore_preview_items: 5
  explore_failure_items: 3
  create_preview_items: 5
  # 编辑器和菜单的最大行数；实际高度可能因终端尺寸而缩小。
  editor_max_lines: 10
  completion_menu_lines: 8

llm:
  default: token-plan/qwen3.8-flash
  # 所有模型共用的 HTTP 首字节超时（秒）。限制连接，以及等到第一批响应数据。
  # 响应开始之后，整轮生成可以继续。不要写到单个模型上。
  timeout: 60
  models:
    token-plan:
      base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api_key: ${TOKEN_PLAN_API_KEY}
      api: chat_completions
      # 额外重试次数；0 表示禁用，可在模型项中覆盖。
      max_retries: 5
      # 流式无进展超时（秒）。连续这么久没有新的模型 chunk 就重试当前请求。
      # 持续输出不受这个上限约束。0 表示禁用，可在模型项中覆盖。
      stream_chunk_timeout: 120
      reasoning_efforts: [none, low, medium, xhigh]
      models:
        qwen3.8-flash:
          input: [text, image]
          context_window: 1m
    # --- 阿里云百炼：官方端点 ---
    # 设置 ALIYUN_API_KEY 环境变量，取消下列注释即可添加百炼来源。
    # 北京公共域名仍可使用，也可替换为官方业务空间专属域名。
    # https://help.aliyun.com/zh/model-studio/qwen-api-via-openai-responses
    # bailian:
    #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   api_key: ${ALIYUN_API_KEY}
    #   api: responses
    #   models:
    #     qwen3.5-plus:
    #       input: [text, image]
    #       context_window: 1m
    #     qwen3.8-flash:
    #       input: [text, image]
    #       context_window: 1m
    #       reasoning_efforts: [none, low, medium, xhigh]
    #     qwen3-vl-flash:
    #       api: chat_completions
    #       input: [text, image]
    #       context_window: 262144
    #
    # --- DeepSeek 官方：Chat Completions API ---
    # https://api-docs.deepseek.com/zh-cn/api/create-chat-completion/
    # deepseek:
    #   api_key: ${DEEPSEEK_API_KEY}
    #   base_url: https://api.deepseek.com/v1
    #   api: chat_completions
    #   reasoning_efforts: [none, low, high, max]
    #   models:
    #     deepseek-flash: {}
    #
    # --- 智谱官方：Chat Completions API ---
    # https://docs.bigmodel.cn/cn/guide/models/text/glm-5.3
    # zhipu:
    #   api_key: ${ZHIPU_API_KEY}
    #   base_url: https://open.bigmodel.cn/api/paas/v4
    #   api: chat_completions
    #   reasoning_efforts: [low, high, max]
    #   models:
    #     glm-5.3: {}
    #
    # 推理强度取决于模型、协议和端点，请按服务商文档维护列表。
    # 模型级省略的字段继承来源配置；声明列表时整表替换；null 或 [] 清除继承的列表。
    # default 仅为命令行选项，不要写入 reasoning_efforts。
    # Responses 使用 reasoning.effort 参数；Chat Completions 使用 reasoning_effort 参数。


web_search:
  # 可选配置。TAVILY_API_KEY 环境变量优先于此值；两者均未设置时隐藏 web_search 工具。
  # 也可以在私有配置 ~/.deep-agent/config.yaml 中直接填写密钥。
  tavily_api_key: null

sandbox:
  # 本段是最小基线，只覆盖常见本机布局。请按实际部署以及需要保护的目录调整挂载、PATH 和环境变量。
  # 可选挂载在源路径不存在时跳过，不表示对应工具已经可用。
  # 宿主机项目目录。沙箱内的路径和当前目录都使用它的真实绝对路径；“.” 表示启动终端界面时的当前目录。
  workspace: .
  bwrap_path: bwrap
  # restricted：只开放工作区、skills 和下面声明的挂载，系统目录只读。
  # full-access：开放宿主上的全部路径，仅保护 Agent 安装文件和配置目录。
  # 配置文件未写 mode 时，代码默认仍是 restricted。
  # 新模板也从 restricted 开始。已有 ~/.deep-agent/config.yaml 不会被这次改动覆盖。
  mode: restricted
  # 默认不限制执行时间；设置正数可限制每条命令的执行秒数。
  timeout_seconds: null
  max_output_bytes: 100000
  # 允许传入沙箱的宿主环境变量。PATH 用宿主的，命令就在宿主目录里解析
  # （~/.nvm、~/esp、~/.espressif 等）。其他普通变量需在这里列出。
  # 代理/CA 变量统一由顶层 trust_env 控制；true 时自动传入，无需重复列出。
  # 有头浏览器复用宿主 X11；宿主未设置 DISPLAY 时不传入。
  env_allowlist:
    - PATH
    - DISPLAY
  # 固定注入的变量，会盖住上面从宿主传入的同名变量。full-access 不要在这里写 PATH，
  # 否则会盖住宿主 PATH。/run/deep-agent 仍会自动放在 PATH 最前。
  # trust_env=false 时，即使在此显式设置代理/CA 变量，也会被移除。
  env_set: {}
  # full-access 已经能看见宿主目录，默认不再把工具改挂到 /opt。
  # 改成 restricted 后，只剩下工作区、skills 和这里声明的挂载。需要工具时再按实际路径加上，例如：
  # extra_read_only_mounts:
  #   - source: ~/.nvm/versions/node
  #     destination: /opt/node
  #     optional: true
  #   - source: ~/.cargo
  #     destination: /opt/cargo
  #     optional: true
  #   - source: ~/.rustup
  #     destination: /opt/rustup
  #     optional: true
  #   - source: /opt/google
  #     destination: /opt/google
  #     optional: true
  #   - source: /tmp/.X11-unix
  #     destination: /tmp/.X11-unix
  #     optional: true
  #   - source: /etc/pki
  #     destination: /etc/pki
  #     optional: true
  # extra_read_write_mounts:
  #   - source: ~/.cache/ms-playwright
  #     destination: /opt/ms-playwright
  #     optional: true
  # source 支持 ~；destination 必须是沙箱内绝对路径。optional: true 表示源不存在就跳过。
  # 挂载整个目录仍会暴露其中的敏感文件。只读只能禁止写入。
  extra_read_only_mounts: []
  extra_read_write_mounts:
    # --dev 会换成沙箱自己的 /dev。要在 full-access 打开 USB 串口等设备节点，用 dev_bind。
    # modes 省略时，这条挂载在 restricted 和 full-access 都生效。旧配置没有 modes，因此仍会在 restricted 开放宿主 /dev。
    # 不要这一条就把此项删掉。只读挂载不能设 dev_bind。
    - source: /dev
      destination: /dev
      dev_bind: true
      modes: [full-access]

paths:
  # SQLite 会话数据库；null 表示使用 ~/.deep-agent/sessions/<workspace-hash>.sqlite3。
  state_path: null
  # 快捷键配置目录；null 表示使用 ~/.deep-agent。
  config_dir: null
