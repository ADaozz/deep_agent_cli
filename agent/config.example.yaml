# DeepAgent template configuration.
# First CLI launch copies this template to ~/.deep-agent/config.yaml and exits.
#
# Override path with DEEP_AGENT_CONFIG=/path/outside/workspace/config.yaml

agent:
  # Long-term user instructions appended after the built-in identity.
  # instructions: |
  #   优先使用中文回答。
  instructions: null

ui:
  # IANA time zone for the time shown after each completed answer.
  timezone: Asia/Shanghai
  # Number of logical thinking lines kept when collapsed; positive integer.
  thinking_tail_lines: 5
  # Collapsed command output and generic tool output (logical lines).
  execute_tail_lines: 4
  tool_tail_lines: 8
  expanded_tool_lines: 40
  # Compact lists (items rather than wrapped screen rows).
  explore_preview_items: 5
  explore_failure_items: 3
  create_preview_items: 5
  # File previews; edit budget must be >= 2 to show both added/deleted lines.
  edit_preview_changed_lines: 8
  write_preview_lines: 6
  # Failed-tool summaries.
  failure_preview_lines: 4
  command_failure_tail_lines: 6
  # Editor/menu row caps; the terminal size can reduce the actual height.
  editor_max_lines: 10
  completion_menu_lines: 8

llm:
  # Required for grouped models: source/model. Change this to select the startup model.
  default: local/qwen-plus
  models:
    local:
      # A literal key or a complete environment reference such as ${MODEL_API_KEY}.
      api_key: sk-local
      base_url: http://localhost:8000/v1
      provider: qwen-responses
      stream_usage: false
      # Available reasoning efforts; when empty, the CLI only offers default (omit API parameters).
      # Set the values accepted by this endpoint; omitted model fields inherit this list.
      reasoning_efforts: []
      models:
        qwen-plus:
          model: qwen3.5-plus
          input: [text, image]
          context_window: 1m
        qwen3.6-flash:
          input: [text, image]
          context_window: 1m
          reasoning_efforts: null  # Explicit null or [] clears inherited efforts.
    # --- Aliyun Bailian: Qwen Chat Completions ---
    # https://help.aliyun.com/zh/model-studio/qwen-api-via-openai-chat-completions
    # Uncomment a group, export its key, and update llm.default to source/model.
    # bailian:
    #   api_key: ${DASHSCOPE_API_KEY}
    #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   provider: openai-compatible
    #   stream_usage: true
    #   reasoning_efforts: [none, low, medium, xhigh]
    #   models:
    #     qwen3.8-flash: {}  # Inherits the group list.
    #     qwen3.8-max: {}
    #     glm-5.3:
    #       reasoning_efforts: [low, high, max]  # Replaces the group list; no none.
    #
    # --- Aliyun Bailian: Responses API ---
    # https://help.aliyun.com/zh/model-studio/qwen-api-via-openai-responses
    # bailian-responses:
    #   api_key: ${DASHSCOPE_API_KEY}
    #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   provider: qwen-responses
    #   reasoning_efforts: [none, low, medium, xhigh]
    #   models:
    #     qwen3.8-flash: {}
    #     qwen3.8-max: {}
    #
    # --- Aliyun Bailian Token Plan ---
    # Confirm supported efforts for your Token Plan endpoint before filling the list.
    # token-plan:
    #   api_key: ${TOKEN_PLAN_API_KEY}
    #   base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    #   provider: openai-compatible
    #   stream_usage: true
    #   reasoning_efforts: []
    #   models:
    #     auto: {}
    #     qwen3.8-flash: {}
    #     qwen3.8-max: {}
    #
    # --- DeepSeek official Chat Completions ---
    # https://api-docs.deepseek.com/zh-cn/api/create-chat-completion/
    # deepseek:
    #   api_key: ${DEEPSEEK_API_KEY}
    #   base_url: https://api.deepseek.com/v1
    #   provider: openai-compatible
    #   reasoning_efforts: [none, low, high, max]
    #   models:
    #     deepseek-flash: {}
    #
    # --- Zhipu official Chat Completions ---
    # https://docs.bigmodel.cn/cn/guide/models/text/glm-5.3
    # zhipu:
    #   api_key: ${ZHIPU_API_KEY}
    #   base_url: https://open.bigmodel.cn/api/paas/v4
    #   provider: openai-compatible
    #   reasoning_efforts: [low, high, max]
    #   models:
    #     glm-5.3: {}
    #
    # Effort lists depend on model, protocol, and endpoint; maintain them from provider docs.
    # Child models inherit omitted fields, replace declared lists, and clear with null or [].
    # default is a CLI-only option: do not put it in reasoning_efforts.
    # Responses sends reasoning.effort; Chat Completions sends reasoning_effort.


web_search:
  # Optional. TAVILY_API_KEY overrides this value; omit both to hide web_search.
  # This field also accepts a literal key in your private ~/.deep-agent/config.yaml.
  tavily_api_key: null

sandbox:
  # Host directory mapped to /workspace. "." = the directory you start the TUI from (cwd).
  workspace: .
  bwrap_path: bwrap
  # Allow dangerous host execution when bubblewrap is unavailable.
  allow_unsandboxed: false
  # No time limit by default. Set a positive number to cap each command.
  timeout_seconds: null
  max_output_bytes: 100000
  # Host env var names explicitly exposed to Agent commands.
  env_allowlist: []
  # Fixed env vars injected into the sandbox. PATH replaces the default, so keep the system dirs.
  # playwright-cli open uses /opt/google/chrome/chrome. Do not install Chrome with
  # `npx playwright install chrome` inside the sandbox; that command needs sudo apt-get.
  # CLI-matched Chromium: on the host run `playwright-cli install-browser chromium`, then
  # `playwright-cli open --browser=chromium`. It uses PLAYWRIGHT_BROWSERS_PATH.
  env_set:
    PATH: /opt/node/bin:/opt/cargo/bin:/usr/local/bin:/usr/bin:/bin
    PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
  # optional: true skips a mount when its source directory does not exist.
  # Replace the Node.js version with the directory under ~/.nvm/versions/node/.
  extra_read_only_mounts:
    - source: ~/.nvm/versions/node/v22.23.2
      destination: /opt/node
      optional: true
    - source: ~/.cargo
      destination: /opt/cargo
      optional: true
    - source: /opt/google
      destination: /opt/google
      optional: true
  # Writable browser cache. Creates, updates, and deletes inside the sandbox change the host directory.
  extra_read_write_mounts:
    - source: ~/.cache/ms-playwright
      destination: /opt/ms-playwright
      optional: true

paths:
  # SQLite session DB. null → ~/.deep-agent/sessions/<workspace-hash>.sqlite3
  state_path: null
  # Keybindings directory. null → ~/.deep-agent
  config_dir: null
