# DeepAgent 示例配置。
# 首次启动命令行时，将此模板复制到 ~/.deep-agent/config.yaml 后退出。
#
# 通过 DEEP_AGENT_CONFIG=/path/outside/workspace/config.yaml 指定配置文件路径。

agent:
  # 长期用户指令，追加在内置身份说明之后。
  # instructions: |
  #   优先使用中文回答。
  instructions: null

ui:
  # 每次回答结束后显示时间所使用的 IANA 时区。
  timezone: Asia/Shanghai
  # 思考内容折叠时保留的逻辑行数，必须为正整数。
  thinking_tail_lines: 5
  # 命令输出及通用工具输出折叠时保留的逻辑行数。
  execute_tail_lines: 4
  tool_tail_lines: 8
  expanded_tool_lines: 40
  # 简略列表显示的条目数，按条目计数，不按屏幕换行计数。
  explore_preview_items: 5
  explore_failure_items: 3
  create_preview_items: 5
  # 文件预览行数；编辑预览至少为 2 行，才能同时显示新增和删除内容。
  edit_preview_changed_lines: 8
  write_preview_lines: 6
  # 工具执行失败时的摘要行数。
  failure_preview_lines: 4
  command_failure_tail_lines: 6
  # 编辑器和菜单的最大行数；实际高度可能因终端尺寸而缩小。
  editor_max_lines: 10
  completion_menu_lines: 8

llm:
  default: token-plan/qwen3.8-flash
  models:
    token-plan:
      base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api_key: ${TOKEN_PLAN_API_KEY}
      api: chat_completions
      reasoning_efforts: [none, low, medium, xhigh]
      models:
        qwen3.8-flash:
          input: [text, image]
          context_window: 1m
    # --- 阿里云百炼：官方端点 ---
    # 设置 ALIYUN_API_KEY 环境变量，取消下列注释即可添加百炼来源。
    # 北京公共域名仍可使用，也可替换为官方业务空间专属域名。
    # https://help.aliyun.com/zh/model-studio/qwen-api-via-openai-responses
    # bailian:
    #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   api_key: ${ALIYUN_API_KEY}
    #   api: responses
    #   models:
    #     qwen3.5-plus:
    #       input: [text, image]
    #       context_window: 1m
    #     qwen3.8-flash:
    #       input: [text, image]
    #       context_window: 1m
    #       reasoning_efforts: [none, low, medium, xhigh]
    #     qwen3-vl-flash:
    #       api: chat_completions
    #       input: [text, image]
    #       context_window: 262144
    #
    # --- DeepSeek 官方：Chat Completions API ---
    # https://api-docs.deepseek.com/zh-cn/api/create-chat-completion/
    # deepseek:
    #   api_key: ${DEEPSEEK_API_KEY}
    #   base_url: https://api.deepseek.com/v1
    #   api: chat_completions
    #   reasoning_efforts: [none, low, high, max]
    #   models:
    #     deepseek-flash: {}
    #
    # --- 智谱官方：Chat Completions API ---
    # https://docs.bigmodel.cn/cn/guide/models/text/glm-5.3
    # zhipu:
    #   api_key: ${ZHIPU_API_KEY}
    #   base_url: https://open.bigmodel.cn/api/paas/v4
    #   api: chat_completions
    #   reasoning_efforts: [low, high, max]
    #   models:
    #     glm-5.3: {}
    #
    # 推理强度取决于模型、协议和端点，请按服务商文档维护列表。
    # 模型级省略的字段继承来源配置；声明列表时整表替换；null 或 [] 清除继承的列表。
    # default 仅为命令行选项，不要写入 reasoning_efforts。
    # Responses 使用 reasoning.effort 参数；Chat Completions 使用 reasoning_effort 参数。


web_search:
  # 可选配置。TAVILY_API_KEY 环境变量优先于此值；两者均未设置时隐藏 web_search 工具。
  # 也可以在私有配置 ~/.deep-agent/config.yaml 中直接填写密钥。
  tavily_api_key: null

sandbox:
  # 映射到沙箱 /workspace 的宿主机目录；“.” 表示启动终端界面时的当前目录。
  workspace: .
  bwrap_path: bwrap
  # 是否允许在 bubblewrap 不可用时直接在宿主机执行命令，此方式具有风险。
  allow_unsandboxed: false
  # 默认不限制执行时间；设置正数可限制每条命令的执行秒数。
  timeout_seconds: null
  max_output_bytes: 100000
  # 明确允许传递给 Agent 命令的宿主机环境变量名称。
  env_allowlist: []
  # 注入沙箱的固定环境变量。PATH 会覆盖默认值，请保留系统目录。
  # playwright-cli open 使用 /opt/google/chrome/chrome。不要在沙箱中执行
  # `npx playwright install chrome` 安装 Chrome，该命令需要 sudo apt-get。
  # 安装与命令行工具匹配的 Chromium：先在宿主机执行 `playwright-cli install-browser chromium`，再执行
  # `playwright-cli open --browser=chromium`。浏览器路径由 PLAYWRIGHT_BROWSERS_PATH 指定。
  env_set:
    PATH: /opt/node/bin:/opt/cargo/bin:/usr/local/bin:/usr/bin:/bin
    PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
  # optional: true 表示源目录不存在时跳过该挂载。
  # 请将 Node.js 版本替换为 ~/.nvm/versions/node/ 下实际存在的目录。
  extra_read_only_mounts:
    - source: ~/.nvm/versions/node/v22.23.2
      destination: /opt/node
      optional: true
    - source: ~/.cargo
      destination: /opt/cargo
      optional: true
    - source: /opt/google
      destination: /opt/google
      optional: true
  # 可写的浏览器缓存；沙箱内的创建、修改和删除操作会同步到宿主机目录。
  extra_read_write_mounts:
    - source: ~/.cache/ms-playwright
      destination: /opt/ms-playwright
      optional: true

paths:
  # SQLite 会话数据库；null 表示使用 ~/.deep-agent/sessions/<workspace-hash>.sqlite3。
  state_path: null
  # 快捷键配置目录；null 表示使用 ~/.deep-agent。
  config_dir: null
