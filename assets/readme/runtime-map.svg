<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">deep-agent：从任务到文件与命令</title>
  <desc id="desc">TUI 和可选 HTTP 服务共享 AgentRunner 与 Deep Agents / LangGraph。宿主内的普通文件工具经 Backend 访问工作区，模型和 Tavily 请求从宿主发出；execute 经 SandboxPool 进入 Bubblewrap Worker。工作区为共享可写挂载，Skills 只读。审批与执行隔离独立。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8b969c"/></marker>
  </defs>
  <rect width="1200" height="940" rx="16" fill="#0c0c0c"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans CJK SC, sans-serif">
    <text x="48" y="64" fill="#61d6d6" font-size="22" font-family="ui-monospace, monospace">deep-agent / runtime</text>
    <text x="48" y="120" fill="#f0f2f3" font-size="42" font-weight="700">同一任务，两条执行通路</text>
    <g id="host-process">
      <rect x="48" y="160" width="1104" height="478" rx="12" fill="#141719" stroke="#485158" stroke-width="2"/>
      <text x="76" y="202" fill="#acb6bc" font-size="24">宿主进程</text>
      <text x="600" y="233" text-anchor="middle" fill="#f0f2f3" font-size="32" font-weight="600">TUI / HTTP（可选）</text>
      <rect x="354" y="278" width="492" height="76" rx="8" fill="#20272a" stroke="#61d6d6" stroke-width="2"/>
      <text x="600" y="326" text-anchor="middle" fill="#f0f2f3" font-size="32" font-weight="600">AgentRunner · 运行控制</text>
      <rect x="354" y="394" width="492" height="76" rx="8" fill="#20272a" stroke="#65747d" stroke-width="2"/>
      <text x="600" y="442" text-anchor="middle" fill="#f0f2f3" font-size="30">Deep Agents / LangGraph</text>
      <g id="file-route">
        <text x="242" y="550" text-anchor="middle" fill="#f0f2f3" font-size="30" font-weight="600">普通文件工具</text>
        <text x="242" y="591" text-anchor="middle" fill="#acb6bc" font-size="26">Backend 路径约束</text>
      </g>
      <g id="host-requests">
        <text x="600" y="550" text-anchor="middle" fill="#f0f2f3" font-size="30" font-weight="600">模型 / Tavily</text>
        <text x="600" y="591" text-anchor="middle" fill="#acb6bc" font-size="26">宿主网络请求</text>
      </g>
      <g id="command-route">
        <text x="958" y="550" text-anchor="middle" fill="#61d6d6" font-size="30" font-weight="600">execute</text>
        <text x="958" y="591" text-anchor="middle" fill="#acb6bc" font-size="26">SandboxPool</text>
      </g>
    </g>
    <g id="authorized-files">
      <rect x="48" y="722" width="520" height="148" rx="12" fill="#172125" stroke="#65747d" stroke-width="2"/>
      <text x="80" y="769" fill="#f0f2f3" font-size="32" font-weight="600">授权文件</text>
      <text x="80" y="809" fill="#f0f2f3" font-size="28">/workspace · 可写</text>
      <text x="80" y="848" fill="#acb6bc" font-size="28">/skills · 只读</text>
    </g>
    <g id="bubblewrap-boundary">
      <rect x="684" y="722" width="468" height="148" rx="12" fill="#122526" stroke="#61d6d6" stroke-width="2"/>
      <text x="716" y="769" fill="#61d6d6" font-size="32" font-weight="600">Bubblewrap Worker</text>
      <text x="716" y="809" fill="#f0f2f3" font-size="28">无网 / 有网 · 按需复用</text>
      <text x="716" y="848" fill="#acb6bc" font-size="26">命令在此执行</text>
    </g>
    <text x="48" y="913" fill="#acb6bc" font-size="24">审批按工具策略触发；SQLite 保存会话。完整边界与例外见正文。</text>
  </g>
  <g fill="none" stroke="#8b969c" stroke-width="2" marker-end="url(#arrow)">
    <path d="M600 246 V274"/>
    <path d="M600 354 V390"/>
    <path d="M420 470 V496 H242 V514"/>
    <path d="M600 470 V514"/>
    <path d="M780 470 V496 H958 V514"/>
    <path d="M242 610 V718"/>
    <path d="M958 610 V718"/>
    <path d="M684 794 H572"/>
  </g>
</svg>
