<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">deep-agent</title>
  <desc id="hero-desc">Linux 和 WSL2 上的终端 Coding Agent。命令默认在 Bubblewrap 中执行，写文件和执行前需要批准。</desc>
  <rect width="1200" height="420" fill="#0c0c0c"/>
  <line x1="628" y1="52" x2="628" y2="368" stroke="#61d6d6" stroke-width="2"/>
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Noto Sans CJK SC, sans-serif">
    <text x="56" y="78" fill="#8d8d8d" font-size="22">Linux / WSL2 · Python 3.12+</text>
    <text x="56" y="162" fill="#61d6d6" font-size="72" font-weight="700">deep-agent</text>
    <text x="56" y="230" fill="#eceae6" font-size="28">在终端里改当前项目。</text>
    <text x="56" y="272" fill="#eceae6" font-size="28">命令默认进 Bubblewrap，</text>
    <text x="56" y="314" fill="#eceae6" font-size="28">写文件和执行前先等你批准。</text>
    <text x="56" y="362" fill="#8d8d8d" font-size="18">0.1.8 预览 · 配置、会话格式和 Python API 可能变更</text>
  </g>
  <g id="terminal-specimen" font-family="ui-monospace, SFMono-Regular, Menlo, Noto Sans Mono CJK SC, monospace">
    <rect x="676" y="52" width="468" height="316" fill="#0c0c0c" stroke="#2e2e2e"/>
    <text x="700" y="96" fill="#61d6d6" font-size="22" font-weight="700">DeepAgent</text>
    <text x="836" y="96" fill="#8d8d8d" font-size="20">terminal coding agent</text>
    <text x="700" y="132" fill="#666666" font-size="18">Esc interrupt · F2 pending · Ctrl+O</text>
    <line x1="700" y1="152" x2="1120" y2="152" stroke="#303030"/>
    <rect x="700" y="250" width="420" height="40" fill="#303030"/>
    <text x="716" y="276" fill="#eceae6" font-size="20">&gt;</text>
    <text x="700" y="334" fill="#13a10e" font-size="20" font-weight="700">SANDBOXED</text>
    <text x="860" y="334" fill="#878787" font-size="20">· perm:ask</text>
  </g>
</svg>
